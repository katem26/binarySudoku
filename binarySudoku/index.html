<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>Binary Sudoku</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
    <link rel="stylesheet" type="text/css" media="screen" href="style.css">
    <script src="script.js"></script>
</head>
<body>
    <table id="board">
    </table>
    <div id="message"></div>
    <div id="buttons">
        <button onclick="restart()">Restart</button>
        <button onclick="newBoard()">New Game</button>
    </div>
    <div id="instructions">
    <h3>How to play:</h3>
    <ul>
        <li>Rows and columns have an equal number of each colour</li>
        <li>No more than two of the same colour can be adjacent in a row or column</li>
        <li>No two rows or columns are the same</li>
    </ul>
    </div>
</body>
</html>
